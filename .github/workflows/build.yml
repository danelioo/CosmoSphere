name: Build CosmoSphere

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3 (pasta completa)
        uses: actions/upload-artifact@v4
        with:
          name: CosmoSphere-VST3-Windows
          path: build/CosmoSphere_artefacts/Release/VST3/CosmoSphere.vst3

      - name: Upload Standalone (teste sem DAW)
        uses: actions/upload-artifact@v4
        with:
          name: CosmoSphere-Standalone-Windows
          path: build/CosmoSphere_artefacts/Release/Standalone/CosmoSphere.exe
